[project]
name = "address-alignment"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "torch==2.13.0+cu130",
    "transformers>=4.40,<6",
    "datasets>=2.19,<6",
    "scikit-learn>=1.4,<2",
    "tensorboard>=2.16,<3",
    "tqdm>=4.66,<5",
    "fastapi>=0.110,<1",
    "pydantic>=2.6,<3",
    "uvicorn>=0.29,<1",
]

# uv 安装时仅将 torch 指向官方 CUDA 13.0 源。
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
